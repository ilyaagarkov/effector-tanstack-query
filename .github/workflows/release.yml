name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # for npm provenance

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm test:types

      - name: Run tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Check publishability
        run: pnpm check:publish

      - name: Publish all workspace packages to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TAG_REF: ${{ github.ref_name }}
        run: |
          # Pre-release tags (v1.0.0-rc.1, v1.2.3-beta.4, …) publish under
          # the prerelease identifier as the dist-tag (`rc`, `beta`).
          # Plain semver tags (v1.0.0, v0.5.0, …) publish under `latest`.
          # Without this, an RC tag would clobber `latest` and break every
          # `npm i pkg` user.
          if [[ "$TAG_REF" =~ -([a-zA-Z]+) ]]; then
            DIST_TAG="${BASH_REMATCH[1]}"
          else
            DIST_TAG="latest"
          fi
          echo "Publishing $TAG_REF under dist-tag: $DIST_TAG"
          pnpm -r --filter './packages/*' publish \
            --access public --no-git-checks --provenance \
            --tag "$DIST_TAG"
