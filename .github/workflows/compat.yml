name: Compat matrix

# Verifies the declared peer-dep ranges (react ^18 || ^19, next 15/16,
# @tanstack/query-core / react-query) actually build & test, instead of
# only the single version pinned in the lockfile.
#
# Runs the full matrix on schedule, manual dispatch, on master / next pushes,
# and on PRs into them — the latter two only when compat-relevant files change
# (path filter keeps it off doc/unrelated changes).

on:
  push:
    branches: [master, next]
    paths:
      - 'packages/core/**'
      - 'packages/react/**'
      - 'examples/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/compat.yml'
  pull_request:
    branches: [master, next]
    paths:
      - 'packages/core/**'
      - 'packages/react/**'
      - 'examples/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/compat.yml'
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC

concurrency:
  group: compat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compat:
    name: React ${{ matrix.react }} + Next ${{ matrix.next }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { react: '18.3', next: '15' } # old stack
          - { react: '19', next: '15' } # smoke React 19 + previous Next
          - { react: '19', next: '16' } # current stack

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pin react/next via pnpm.overrides
        env:
          REACT: ${{ matrix.react }}
          NEXT: ${{ matrix.next }}
        run: |
          REACT_MAJOR=${REACT%%.*}
          jq \
            --arg react "^${REACT}" \
            --arg reactDom "^${REACT}" \
            --arg typesReact "^${REACT_MAJOR}" \
            --arg typesReactDom "^${REACT_MAJOR}" \
            --arg next "^${NEXT}" \
            '.pnpm.overrides += {
              "react": $react,
              "react-dom": $reactDom,
              "@types/react": $typesReact,
              "@types/react-dom": $typesReactDom,
              "next": $next
            }' \
            package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Applied overrides:"
          jq '.pnpm.overrides' package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Type check
        run: pnpm test:types

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Build SSR example (Next prod build)
        run: pnpm --filter ./examples/ssr build

      - name: Build CSR example (Vite)
        run: pnpm --filter ./examples/csr build

  tanstack:
    name: TanStack Query ${{ matrix.tanstack }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The latest version runs in ci.yml via the lockfile. The others mark
        # the 5.x changes the adapter accounts for. Type tests describe the
        # newest typings, so older versions check the production sources only
        # (`types: src`); runtime tests skip behavior TanStack added later.
        include:
          - { tanstack: '5.0.0', types: src } # peer floor
          - { tanstack: '5.14.0', types: src } # mutationKey change resets the observer
          - { tanstack: '5.28.0', types: src } # refetch uses the latest observer options
          - { tanstack: '5.36.0', types: src } # isFetchNextPageError
          - { tanstack: '5.48.0', types: src } # callback enabled
          - { tanstack: '5.80.0', types: full } # infinite observer types drop TQueryData
          - { tanstack: '5.89.0', types: full } # mutation callbacks gain a context
          - { tanstack: '5.91.0', types: full } # declarations import `tsup`
          - { tanstack: '5.99.0', types: full }

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Pin @tanstack/query-core and react-query via pnpm.overrides
        env:
          TANSTACK: ${{ matrix.tanstack }}
        run: |
          jq --arg v "$TANSTACK" \
            '.pnpm.overrides += {
              "@tanstack/query-core": $v,
              "@tanstack/react-query": $v
            }' \
            package.json > package.json.tmp && mv package.json.tmp package.json
          echo "Applied overrides:"
          jq '.pnpm.overrides' package.json

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify the pinned version
        env:
          TANSTACK: ${{ matrix.tanstack }}
        run: |
          for pkg in query-core react-query; do
            actual=$(node -p "require('./packages/react/node_modules/@tanstack/$pkg/package.json').version")
            echo "@tanstack/$pkg: $actual"
            test "$actual" = "$TANSTACK"
          done

      - name: Type check
        run: pnpm ${{ matrix.types == 'full' && 'test:types' || 'test:types:src' }}

      - name: Run tests
        run: >-
          pnpm -r --filter './packages/*' run test
          ${{ matrix.types == 'full' && ' ' || '--typecheck.enabled=false' }}

      - name: Build packages
        run: pnpm build
